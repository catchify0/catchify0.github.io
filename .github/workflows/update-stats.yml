name: Update Project Stats

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes (GitHub Actions minimum)
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main # Also run on every push to main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats and write stats.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch repo info (public API)
          REPO=$(curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/catchify0/catchify0.github.io")

          STARS=$(echo "$REPO" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print(d.get('stargazers_count', 0))
          except:
              print(1)
          ")
          FORKS=$(echo "$REPO" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print(d.get('forks_count', 0))
          except:
              print(0)
          ")
          echo "Stars: $STARS | Forks: $FORKS"

          # Fetch all releases (authenticated with GH_TOKEN)
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/catchify0/catchify0.github.io/releases?per_page=100" > /tmp/releases.json

          STARS=$STARS FORKS=$FORKS python3 -c "
          import json, sys, os

          with open('/tmp/releases.json', 'r', encoding='utf-8') as f:
              releases = json.load(f)
          if not isinstance(releases, list):
              raise ValueError('GitHub releases API returned a non-list response')

          total_downloads = 0
          apk_downloads = 0
          ipa_downloads = 0

          for r in releases:
              for a in r.get('assets', []):
                  name = a.get('name', '').lower()
                  cnt = int(a.get('download_count', 0) or 0)
                  total_downloads += cnt
                  if name.endswith('.apk'):
                      apk_downloads += cnt
                  elif name.endswith('.ipa'):
                      ipa_downloads += cnt

          latest = releases[0] if releases else {}
          version = latest.get('tag_name', 'v2.4.2')
          body = next((r.get('body') for r in releases if r.get('body')), '')

          # Releases can be split by platform, so select the newest valid
          # asset for each platform instead of looking only in the first release.
          apk_url = ''
          ipa_url = ''
          android_version = ''
          ios_version = ''

          for release in releases:
              release_version = release.get('tag_name', '')
              for asset in release.get('assets', []):
                  name = asset.get('name', '').lower()
                  url = asset.get('browser_download_url', '')
                  if name.endswith('.apk') and 'arm64' not in name and 'debug' not in name:
                      if not apk_url:
                          apk_url = url
                          android_version = release_version
                  elif name.endswith('.ipa') and not ipa_url:
                      ipa_url = url
                      ios_version = release_version

          if not apk_url:
              raise ValueError('No APK asset found in the release list')
          if not ipa_url:
              raise ValueError('No IPA asset found in the release list')

          try:
              stars = int(os.environ.get('STARS', '1'))
          except:
              stars = 1
          try:
              forks = int(os.environ.get('FORKS', '0'))
          except:
              forks = 0

          stats = {
              'stars': stars,
              'forks': forks,
              'downloads': total_downloads,
              'apk_downloads': apk_downloads,
              'ipa_downloads': ipa_downloads,
              'version': version if str(version).startswith('v') else f'v{version}',
              'android_version': android_version if str(android_version).startswith('v') else f'v{android_version}' if android_version else None,
              'ios_version': ios_version if str(ios_version).startswith('v') else f'v{ios_version}' if ios_version else None,
              'apk_url': apk_url or None,
              'ipa_url': ipa_url or None,
              'changelog': body
          }

          with open('stats.json', 'w', encoding='utf-8') as f:
              json.dump(stats, f, indent=2, ensure_ascii=False)

          print(f'Successfully updated stats.json: Total={total_downloads}, APK={apk_downloads}, IPA={ipa_downloads}')
          "

          echo "Written stats.json:"
          cat stats.json

          python3 - <<'PY'
          import json

          with open('stats.json', 'r', encoding='utf-8') as source:
              stats = json.load(source)
          with open('check.json', 'r', encoding='utf-8') as source:
              check = json.load(source)

          def without_v(value):
              return value[1:] if isinstance(value, str) and value.startswith('v') else value

          check['version'] = without_v(stats.get('android_version') or stats.get('version'))
          check['androidVersion'] = without_v(stats.get('android_version'))
          check['iosVersion'] = without_v(stats.get('ios_version'))
          check['url'] = stats.get('apk_url')
          check['iosurl'] = stats.get('ipa_url')
          check['stats'] = {
              'stars': stats.get('stars', 0),
              'forks': stats.get('forks', 0),
              'downloads': stats.get('downloads', 0),
              'apk_downloads': stats.get('apk_downloads', 0),
              'ipa_downloads': stats.get('ipa_downloads', 0),
          }

          with open('check.json', 'w', encoding='utf-8') as target:
              json.dump(check, target, indent=2, ensure_ascii=False)
              target.write('\n')
          PY

      - name: Create stats update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-project-stats
          delete-branch: true
          commit-message: "chore(stats): auto-update stats.json"
          title: "chore(stats): update project statistics"
          body: |
            Automated update of `stats.json` and `check.json` from the latest public website releases.
          add-paths: |
            stats.json
            check.json
