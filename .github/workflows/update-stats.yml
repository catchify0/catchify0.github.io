name: Update Project Stats

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes (GitHub Actions minimum)
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main # Also run on every push to main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats and write stats.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch repo info (public API)
          REPO=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/catchify0/catchify.io")

          STARS=$(echo "$REPO" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print(d.get('stargazers_count') or d.get('watchers_count') or 0)
          except:
              print(1)
          ")
          FORKS=$(echo "$REPO" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print(d.get('forks_count') or d.get('forks') or 0)
          except:
              print(0)
          ")
          echo "Stars: $STARS | Forks: $FORKS"

          # Fetch all releases (authenticated with GH_TOKEN)
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/catchify0/catchify.io/releases?per_page=100" > /tmp/releases.json

          STARS=$STARS FORKS=$FORKS python3 -c "
          import json, sys, os

          try:
              with open('/tmp/releases.json', 'r', encoding='utf-8') as f:
                  releases = json.load(f)
          except Exception as e:
              print('Failed to parse releases:', e)
              releases = []

          total_downloads = 0
          apk_downloads = 0
          ipa_downloads = 0

          if isinstance(releases, list):
              for r in releases:
                  for a in r.get('assets', []):
                      name = a.get('name', '').lower()
                      cnt = a.get('download_count', 0)
                      total_downloads += cnt
                      if name.endswith('.apk'):
                          apk_downloads += cnt
                      elif name.endswith('.ipa') or '.ipa' in name:
                          ipa_downloads += cnt

          latest = releases[0] if isinstance(releases, list) and len(releases) > 0 else {}
          version = latest.get('tag_name', 'v2.4.0')
          body = latest.get('body', '')

          apk_url = 'https://github.com/catchify0/catchify.io/releases/download/2.4.0/catchify-v2.4.0.apk'
          ipa_url = 'https://github.com/catchify0/catchify.io/releases/download/2.4.0/Catchify-v2.4.0.ipa'

          for a in latest.get('assets', []):
              name = a.get('name', '').lower()
              url = a.get('browser_download_url', '')
              if name.endswith('.apk') and 'arm64' not in name:
                  apk_url = url
              elif name.endswith('.ipa'):
                  ipa_url = url

          try:
              stars = int(os.environ.get('STARS', '1'))
          except:
              stars = 1
          try:
              forks = int(os.environ.get('FORKS', '0'))
          except:
              forks = 0

          stats = {
              'stars': stars,
              'forks': forks,
              'downloads': total_downloads,
              'apk_downloads': apk_downloads,
              'ipa_downloads': ipa_downloads,
              'version': version if str(version).startswith('v') else f'v{version}',
              'apk_url': apk_url,
              'ipa_url': ipa_url,
              'changelog': body
          }

          with open('stats.json', 'w', encoding='utf-8') as f:
              json.dump(stats, f, indent=2, ensure_ascii=False)

          print(f'Successfully updated stats.json: Total={total_downloads}, APK={apk_downloads}, IPA={ipa_downloads}')
          "

          echo "Written stats.json:"
          cat stats.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --staged --quiet; then
            echo "No changes to stats.json"
          else
            git commit -m "chore(stats): auto-update stats.json [skip ci]"
            git push
          fi
