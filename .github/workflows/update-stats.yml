name: Update Project Stats

on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main # Also run on every push to main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats and write stats.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch repo info (stars, forks)
          REPO=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/thamodharangm/catchify")

          STARS=$(echo "$REPO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['stargazers_count'])")
          FORKS=$(echo "$REPO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['forks_count'])")

          # Fetch all releases and sum download_count
          RELEASES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/thamodharangm/catchify/releases?per_page=100")

          DOWNLOADS=$(echo "$RELEASES" | python3 -c "
          import json, sys
          releases = json.load(sys.stdin)
          total = sum(
              asset.get('download_count', 0)
              for release in releases
              for asset in release.get('assets', [])
          )
          print(total)
          ")

          # Write stats.json
          echo "{\"stars\": $STARS, \"forks\": $FORKS, \"downloads\": $DOWNLOADS}" > stats.json
          echo "Stats: stars=$STARS forks=$FORKS downloads=$DOWNLOADS"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --staged --quiet; then
            echo "No changes to stats.json"
          else
            git commit -m "chore(stats): auto-update stats.json [skip ci]"
            git push
          fi
