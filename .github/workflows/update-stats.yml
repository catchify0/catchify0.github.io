name: Update Project Stats

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes (GitHub Actions minimum)
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main # Also run on every push to main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats and write stats.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch repo info - no auth (public repo, avoids token masking issues)
          REPO=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/thamodharangm/catchify")

          STARS=$(echo "$REPO" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          # stargazers_count and watchers_count are the same for stars
          print(d.get('stargazers_count') or d.get('watchers_count') or 0)
          ")
          FORKS=$(echo "$REPO" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(d.get('forks_count') or d.get('forks') or 0)
          ")
          echo "Stars: $STARS | Forks: $FORKS"

          # Fetch all releases (authenticated to handle rate limits)
          RELEASES=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/thamodharangm/catchify/releases?per_page=100")

          DOWNLOADS=$(echo "$RELEASES" | python3 -c "
          import json, sys
          releases = json.load(sys.stdin)
          total = sum(
              asset.get('download_count', 0)
              for release in releases
              for asset in release.get('assets', [])
          )
          print(total)
          ")
          echo "Downloads: $DOWNLOADS"

          # Write stats.json
          echo "{\"stars\": $STARS, \"forks\": $FORKS, \"downloads\": $DOWNLOADS}" > stats.json
          echo "Written stats.json:"
          cat stats.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --staged --quiet; then
            echo "No changes to stats.json"
          else
            git commit -m "chore(stats): auto-update stats.json [skip ci]"
            git push
          fi
